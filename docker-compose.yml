services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kuchnia_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      - MSSQL_MEMORY_LIMIT_MB=${MSSQL_MEMORY_LIMIT_MB:-768}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\"; else /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\"; fi"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: ${MSSQL_CONTAINER_MEMORY_LIMIT:-1g}

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kuchnia_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      - MSSQL_DB_NAME=${MSSQL_DB_NAME:?MSSQL_DB_NAME is required}
      - MSSQL_ADMIN_PASSWORD=${MSSQL_ADMIN_PASSWORD:?MSSQL_ADMIN_PASSWORD is required}
      - MSSQL_PRACOWNIK_PASSWORD=${MSSQL_PRACOWNIK_PASSWORD:?MSSQL_PRACOWNIK_PASSWORD is required}
      - MSSQL_KLIENT_PASSWORD=${MSSQL_KLIENT_PASSWORD:?MSSQL_KLIENT_PASSWORD is required}
    volumes:
      - ./docker/sqlserver-init.sql:/init/sqlserver-init.sql:ro
    command: >
      /bin/bash -c '
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd";
        TRUST_CERT="-C";
        if [ ! -x "$$SQLCMD" ]; then SQLCMD="/opt/mssql-tools/bin/sqlcmd"; TRUST_CERT=""; fi;
        "$$SQLCMD" -S sqlserver,1433 -U sa -P "$$MSSQL_SA_PASSWORD" $$TRUST_CERT -d master \
          -v DbName="$$MSSQL_DB_NAME" \
             AdminPassword="$$MSSQL_ADMIN_PASSWORD" \
             PracownikPassword="$$MSSQL_PRACOWNIK_PASSWORD" \
             KlientPassword="$$MSSQL_KLIENT_PASSWORD" \
          -i /init/sqlserver-init.sql
      '
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kuchnia_web
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${MSSQL_DB_NAME:?MSSQL_DB_NAME is required};User Id=pracownik;Password=${MSSQL_PRACOWNIK_PASSWORD:?MSSQL_PRACOWNIK_PASSWORD is required};Encrypt=True;TrustServerCertificate=True;
      - ConnectionStrings__MigrationConnection=Server=sqlserver,1433;Database=${MSSQL_DB_NAME:?MSSQL_DB_NAME is required};User Id=admin;Password=${MSSQL_ADMIN_PASSWORD:?MSSQL_ADMIN_PASSWORD is required};Encrypt=True;TrustServerCertificate=True;
      - DatabaseSeeding__Enabled=true
      - DatabaseSeeding__Mode=Both
      - DatabaseSeeding__Profile=DemoData
      - DatabaseSeeding__ResetDemoData=true
      - Stripe__SecretKey=${STRIPE_SECRET}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE}
      - OpenAI__ApiKey=${OPENAI_KEY}
      - SERVICESTACK_LICENSE=${SERVICESTACK_LICENSE:-}
    volumes:
      - uploads_data:/app/wwwroot/uploads
    restart: unless-stopped
    mem_limit: ${WEB_CONTAINER_MEMORY_LIMIT:-512m}

volumes:
  mssql_data:
  uploads_data:
