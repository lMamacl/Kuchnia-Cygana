services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kuchnia_web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/kuchniaucygana.db
      - Stripe__SecretKey=${STRIPE_SECRET}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE}
      - OpenAI__ApiKey=${OPENAI_KEY}
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:
