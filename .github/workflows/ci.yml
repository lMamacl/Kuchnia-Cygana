name: CI — Build, Test & Coverage

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore KuchniaUCygana.sln

      - name: Build (Release)
        run: dotnet build KuchniaUCygana.sln --configuration Release --no-restore

      - name: Upload build artifact inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: |
            KuchniaUCygana.sln
            src/
            tests/
          retention-days: 1

  unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore KuchniaUCygana.sln

      - name: Build (Release)
        run: dotnet build KuchniaUCygana.sln --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: |
          dotnet test KuchniaUCygana.sln \
            --configuration Release \
            --no-build \
            --filter "Category!=Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/**/*.trx
          retention-days: 30

  integration-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore KuchniaUCygana.sln

      - name: Build (Release)
        run: dotnet build KuchniaUCygana.sln --configuration Release --no-restore

      - name: Run integration tests
        run: |
          dotnet test KuchniaUCygana.sln \
            --configuration Release \
            --no-build \
            --filter "Category=Integration" \
            --results-directory ./TestResultsIntegration \
            --logger "trx;LogFileName=integration-results.trx"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResultsIntegration/**/*.trx
          retention-days: 30
