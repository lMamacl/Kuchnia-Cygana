name: CI

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore KuchniaUCygana.sln
      - name: Build
        run: dotnet build KuchniaUCygana.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test KuchniaUCygana.sln --configuration Release --no-build
