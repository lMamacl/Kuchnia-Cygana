# ============================================================
# 7. WYMAGANIA NIEFUNKCJONALNE & TECHNICZNE
# ============================================================
- **Walidacja:** co najmniej 6 różnych reguł – zaimplementowane w FluentValidation:
  - `ReceiveDeliveryValidator`: StockItemId > 0, SupplierBatchNumber.NotEmpty(), Quantity.GreaterThan(0), ExpiryDate.GreaterThan(now) (jeśli podana), Notes.MaxLength(500).
  - `RegisterWasteValidator`: StockItemId > 0, Quantity.GreaterThan(0), Reason.NotEmpty().MaxLength(250), BatchId.GreaterThan(0) gdy podany.
  - `LogTemperatureValidator`: DeviceNameOrLocation.NotEmpty().MaxLength(50), TemperatureCelsius.InclusiveBetween(-50,50).
  - `CreateProductionPlanValidator`: ProductionDate.GreaterThanOrEqualTo(today), Notes.MaxLength(500).
  - `CreateOrderRequestValidator`: AddressId > 0, StartDate.GreaterThanOrEqualTo(DateTime.Today.AddDays(1)), Items.NotEmpty(), TotalDays 1-365, PricePerDay > 0.
  - `CreateAddressRequestValidator`: Label.NotEmpty().MaxLength(50), Street.NotEmpty(), BuildingNumber.NotEmpty(), City.NotEmpty(), PostalCode.Matches(@"^\d{2}-\d{3}$").
- **Edycja na bieżących danych:** formularze pre‑filled z bazy – np. `Receive` GET wypełnia listę składników, `Warehouse/Receive` POST przy błędzie zwraca ten sam widok z wprowadzonymi danymi.
- **Udostępnianie danych (sharing):** generowanie tokena UUID dla manifestu (`PackingManifest.ManifestNumber`), widok publiczny manifestu JSON (`/packing/loading/{routeId}/manifest`).
- **Sortowanie:** w widoku magazynu (`Warehouse/Index`) – tabela sortowalna przez kliknięcie nagłówków (za pomocą HTMX + parametry zapytania). Preferencje sortowania zapisywane w ciasteczku `sortPrefs` (JavaScript).
- **Filtrowanie:** 
  - Filtrowanie stanów magazynowych po kategorii – pole tekstowe (wyszukiwarka) w `Warehouse/Index`.
  - Filtrowanie planu produkcji po dacie (kalendarz).
  - Filtrowanie raportu HACCP po zakresie dat.
- **Uwierzytelnianie / rejestracja:** formularze login/register (szkielety, pełna implementacja w kolejnych sprintach). Hasła haszowane BCrypt. Domyślna rola po rejestracji: `Client`.
- **Zapis sesji do bazy:** nie dotyczy (brak głosowań). Stan koszyka przechowywany w ciasteczku (serializowany JSON) – `CartService`.
- **Dodatkowe elementy:** 
  - Strona główna publiczna (`Home/Index`).
  - Panel administracyjny (`AdminController`) – zarządzanie użytkownikami, rolami, ustawieniami.
  - Panel kierowcy (uproszczony, mobilny) – `DriverMobileController`.
  - Globalna obsługa błędów: `ErrorController` (domyślnie) + middleware Serilog.

# ============================================================
# 8. WARSTWA PREZENTACJI (GUI)
# ============================================================
Silnik szablonów: Razor (.cshtml)
Liczba formularzy z walidacją: minimum 3 (przyjęcie dostawy, rejestracja odpadu, log temperatury) – wszystkie używają `asp-validation-for` i jQuery Validation Unobtrusive.
Użyte tagi / komponenty Razor:
  - `@model`
  - `@await Html.PartialAsync(...)`
  - `@Html.AntiForgeryToken()`
  - `asp-validation-for`, `asp-validation-summary`
  - `asp-action`, `asp-controller`, `asp-route-*`
  - `@RenderBody()`, `@RenderSection()`
  - `@inject` (wstrzykiwanie zależności do widoków, np. `IAntiforgery`)
Dostępność (WCAG): 
  - Użycie `aria-label`, `alt` w obrazkach (np. ikony).
  - Kontrast zapewniony przez Tabler/Bootstrap.
  - Nawigacja klawiaturowa (domyślna dla linków i przycisków).

Dodatkowo:
  - Layouty: `_Layout` (kliencki), `_LayoutStaff` (Tabler), `_LayoutDriver` (uproszczony).
  - Partiale globalne: `_SidebarPartial`, `_TopbarStaffPartial`, `_HeaderStaffPartial`, `_StaffAlertsPartial`, `_ValidationScriptsPartial`.
  - HTMX: atrybuty `hx-get`, `hx-post`, `hx-target`, `hx-swap`, `hx-trigger`, `hx-indicator` (np. w `Packing/Index`).
  - Alpine.js: `x-data`, `x-show`, `x-cloak`, `@click` (np. w `Production/FoilPrinting` – modal potwierdzenia).

