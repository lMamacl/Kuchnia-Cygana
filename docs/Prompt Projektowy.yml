| Zasób / Akcja | Client | Kitchen | KitchenManager | Warehouse | WarehouseManager | Packing | PackingManager | Admin |
|---------------|--------|---------|----------------|-----------|------------------|---------|----------------|-------|
| Podgląd planu produkcji | nie | tak | tak | nie | nie | nie | nie | tak |
| Generowanie planu | nie | nie | tak | nie | nie | nie | nie | tak |
| Zatwierdzenie gotowania | nie | nie | tak | nie | nie | nie | nie | tak |
