# ============================================================
# 2. DZIEDZINA (DOMAIN MODEL)
# ============================================================
Wymagane encje: minimum 3 klasy domenowe z relacjami kompozycji (@OneToMany). Wszystkie implementują BaseEntity lub AuditableEntity (ISoftDeletable). 
Lista encji i pól (skrócona – pełna lista w kodzie):

- **User** (BaseEntity)
  - Id (int)
  - Email (string, unique)
  - PasswordHash (string)
  - FirstName, LastName (string)
  - Role (string, np. Client, Kitchen, Admin)
- **Order** (AuditableEntity)
  - CustomerId (int)
  - OrderNumber (string)
  - Status (OrderStatus)
  - TotalPrice, DiscountAmount, FinalPrice (decimal)
  - StartDate, EndDate (DateTime?)
  - Items (List<OrderItem>)
  - DeliveryDays (List<DeliveryCalendar>)
- **OrderItem** (AuditableEntity) – powiązane z Order (ManyToOne)
- **ProductionPlan** (AuditableEntity)
  - ProductionDate (DateOnly)
  - Status (ProductionPlanStatus)
  - Items (List<ProductionPlanItem>)
- **ProductionPlanItem** (AuditableEntity) – powiązane z ProductionPlan (ManyToOne)
- **StockItem** (AuditableEntity)
  - Name (string)
  - DefaultUnitOfMeasureId (int)
  - MinimumLevel (decimal)
  - LeadTimeDays (int)
- **Batch** (AuditableEntity) – powiązane z StockItem (ManyToOne)
  - SupplierBatchNumber (string)
  - CurrentQuantity (decimal)
  - ExpiryDate (DateTimeOffset?)
  - ReceivedDate (DateTimeOffset)
- **PackingSession** (AuditableEntity)
  - PackingDate (DateOnly)
  - OrderId (int?)
  - Status (PackingStatus)
  - Items (List<PackingItem>)
- **PackingItem** (AuditableEntity) – powiązane z PackingSession (ManyToOne)
- **TemperatureLog** (AuditableEntity<long>)
  - DeviceNameOrLocation (string)
  - RecordedTemperatureCelsius (decimal)

Atrybuty pochodne / wyliczeniowe:
- `Order.FinalPrice = TotalPrice - DiscountAmount`
- `StockItemDto.CurrentStock` – suma `Batch.CurrentQuantity` dla aktywnych partii
- `FoodCostEntry.Shortage = TotalWeightGrams - AvailableInStock` (jeśli ujemny → 0)

