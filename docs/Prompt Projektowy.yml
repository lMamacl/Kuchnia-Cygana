# 9. TESTOWANIE
# ============================================================
- **Testy jednostkowe (Unit):**
  - `UserServiceTests` – sprawdza mapowanie User → UserDto.
  - `BatchRepositoryTests` (mock) – testuje logikę sortowania FEFO i filtrowania.
  - `ForbiddenPersistenceUsageTests` – wyszukuje zakazanych terminów (ServiceStack, License bypass).
- **Testy integracyjne (Integration):**
  - `SqlServerMigrationAndSeedingTests` – weryfikuje migracje i seeding na kontenerze SQL Server (Testcontainers).
  - `WarehouseRepositoriesSqlServerTests` – testuje `BatchRepository`, `InventoryTransactionRepository`, `PackingSessionRepository`, `TemperatureLogRepository`, `M1OrderDataProvider` na prawdziwej bazie.
  - `PackingService` – testy integracyjne całego flow kompletacji (tworzenie toreb, pakowanie, manifest).
- **Testy bezpieczeństwa:** pośrednio przez `[Authorize]` i testy integracyjne (np. sprawdzenie, czy endpointy wymagają odpowiednich ról – do zaimplementowania).

Uruchamianie: 
  - Wszystkie testy: `dotnet test KuchniaUCygana.sln`
  - Tylko jednostkowe: `dotnet test --filter "Category!=Integration"`
  - Tylko integracyjne: `dotnet test --filter "Category=Integration"`

