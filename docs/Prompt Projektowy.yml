| Zarządzanie użytkownikami | nie | nie | nie | nie | nie | nie | nie | tak |

Uwierzytelnianie: 
  - Cookie Authentication (ASP.NET Core Identity‑like) – HttpOnly cookie, sliding expiration 30 min.
  - Hasła: BCrypt.Net-Next (BCrypt hash).
  - W środowisku Development dostępny bypass (`/account/dev-login`) dla szybkiego testowania ról.

Zasady sesji / tokena: 
  - Cookie `KuchniaUCygana.Auth` z flagami HttpOnly, Secure (Always), SameSite=Lax.
  - Logout usuwa ciasteczko.
  - Brak JWT – standardowe cookie.

# ============================================================
# 4. API (REST/gRPC/GraphQL) – ENDPOINTY
# ============================================================
Prefiks bazowy: brak – standardowe routing MVC (kontrolery).
Format odpowiedzi: HTML (widoki) lub JSON (dla wybranych endpointów, np. `/packing/manifest`).
Paginacja i sortowanie: realizowane w widokach przez parametry zapytania.

Lista kluczowych endpointów (zaznaczono HTTP, ścieżka, opis, uprawnienia):

| Metoda | Ścieżka | Opis | Request Body | Response | Uprawnienia |
|--------|---------|------|--------------|----------|--------------|
| GET | /warehouse | Pulpit magazynu (stany, alerty) | – | View (Warehouse/Index) | Warehouse,WarehouseManager,Admin |
| POST | /warehouse/receive | Przyjęcie dostawy – tworzy partię | ReceiveDeliveryRequest | Redirect do /warehouse | Warehouse,WarehouseManager,Admin |
| POST | /warehouse/waste | Rejestracja odpadu (FEFO) | RegisterWasteRequest | Redirect do /warehouse | Warehouse,WarehouseManager,Admin |
| GET | /production | Pulpit produkcji | – | View (Production/Index) | Kitchen,KitchenManager,Admin |
| POST | /production/generate | Generowanie planu produkcji | CreateProductionPlanRequest | Redirect do /production | KitchenManager,Admin |
| GET | /production/cooking-card/{planItemId} | Karta gotowania (receptura skalowana) | – | View (Production/CookingCard) | Kitchen,KitchenManager,Admin |
| POST | /production/approve-cooking | Zatwierdzenie ugotowania | planItemId, actualQuantity | Redirect do /production | KitchenManager,Admin |
| GET | /packing | Kompletacja toreb | – | View (Packing/Index) | Packing,PackingManager,Admin |
| POST | /packing/start | Rozpoczęcie sesji pakowania | date, packedBy | Redirect | Packing,PackingManager,Admin |
| POST | /packing/pack-client | Spakowanie zamówienia do torby | sessionId, orderId | Redirect | Packing,PackingManager,Admin |
| POST | /packing/loading/{routeId}/manifest | Generowanie manifestu | date | Redirect | PackingManager,Admin |
| GET | /packing/labels/{sessionId} | Etykiety transportowe (QR) | – | View (Packing/Labels) | Packing,PackingManager,Admin |
| GET | /warehouse/haccp-report | Raport HACCP | from, to | View (HaccpReport) | WarehouseManager,Admin |
| POST | /account/dev-login | Logowanie deweloperskie (bypass) | role, returnUrl | Redirect | tylko Development |
| POST | /account/logout | Wylogowanie | – | Redirect do Home | publiczne |

